name: CI

on:
  # Validate pushes only on main (post-merge). Feature branches are covered
  # by pull_request while their PR is open — listing a branch here *and*
  # having an open PR for it runs every check twice, once per event.
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Build + test the vendored-libmarpa workspace on every target OS, proving
  # the crate is portable: the cc/bindgen build path in libmarpa-sys/build.rs
  # must drive cl.exe (windows-msvc) as well as cc/clang (linux, macos).
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # bindgen needs libclang. It is preinstalled on all three runners, but
      # on Windows clang-sys only finds libclang.dll reliably when pointed at
      # the LLVM bin directory explicitly.
      - name: Set libclang path (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"
      # macOS's allocator fills freed memory (MallocScribble) and new memory
      # (MallocPreScribble) with garbage, so a use of freed memory, such as
      # TLS or obstack chunks touched at thread exit, misreads and fails
      # even without ASan.
      - name: Scribble freed and new memory (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "MallocScribble=1" >> "$GITHUB_ENV"
          echo "MallocPreScribble=1" >> "$GITHUB_ENV"
      - name: cargo build
        run: cargo build --workspace --all-targets
      - name: cargo test
        run: cargo test --workspace
      # The same tests with the obstack chunk cache's test-only counters, which
      # the plain run (the production C) does not compile.
      - name: cargo test (chunk-cache-stats)
        run: cargo test --workspace --features chunk-cache-stats

  # AddressSanitizer over the marpa crate's tests, libmarpa's C instrumented
  # too (clang + CFLAGS; cc reads CFLAGS), on the two targets with the
  # obstack chunk cache (libmarpa-sys/c/marpa_obs.c; Windows keeps plain
  # malloc/free). It catches what an equal-output test cannot: a chunk reused
  # for a larger request, freed memory touched at thread exit. Only
  # marpa-asf: libmarpa-sys's own create_grammar test never unrefs its
  # grammar, which LeakSanitizer reports. Leak detection stays on (Linux;
  # macOS's ASan has no LeakSanitizer).
  asan:
    name: asan (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    env:
      RUSTFLAGS: -Zsanitizer=address
      CC: clang
      CFLAGS: -fsanitize=address -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # -Zsanitizer needs an explicit --target, so the sanitizer flags reach
      # the tests and not the build scripts.
      - name: cargo test (ASan)
        run: cargo test -p marpa-asf --target ${{ matrix.target }}
      - name: cargo test (ASan, chunk-cache-stats)
        run: cargo test -p marpa-asf --features chunk-cache-stats --target ${{ matrix.target }}

  # Lint once on Linux — clippy/rustfmt results are platform-independent, so
  # running them across the matrix would only triple the chance of a flake.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo clippy (chunk-cache-stats)
        run: cargo clippy --workspace --all-targets --features chunk-cache-stats -- -D warnings
